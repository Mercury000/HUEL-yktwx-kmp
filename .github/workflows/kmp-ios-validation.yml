name: Kotlin and iOS migration validation

on:
  push:
    branches: [codex/kmp-ios-validation]
    paths: [migration/**, .github/workflows/kmp-ios-validation.yml, app/src/main/**, app/src/test/**]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kmp-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/cache@v6
        with:
          path: ~/.konan
          key: ${{ runner.os }}-kotlin-native-v2.4.21
      - name: Run shared JVM and iOS tests
        run: |
          chmod +x gradlew
          ./gradlew -p migration :shared:desktopTest :shared:iosSimulatorArm64Test --console=plain --no-daemon --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process
      - name: Compile original UI for iOS
        run: |
          xcrun simctl shutdown all
          ./gradlew -p migration :composeApp:linkDebugFrameworkIosSimulatorArm64 --console=plain --no-daemon --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process
      - name: Prepare Xcode simulator app
        run: |
          if ! command -v xcodegen >/dev/null; then brew install xcodegen; fi
          python3 migration/scripts/select_simulator.py
          cd migration/iosApp
          xcodegen generate
      - name: Run iOS UI checks and capture screenshots
        working-directory: migration/iosApp
        run: |
          xcodebuild test -project CaiXiaoTongMigration.xcodeproj -scheme CaiXiaoTongMigration \
            -destination "platform=iOS Simulator,id=$IOS_SIMULATOR_ID" \
            -derivedDataPath DerivedData -resultBundlePath Migration.xcresult \
            CODE_SIGNING_ALLOWED=NO
      - name: Export simulator screenshots
        if: always()
        working-directory: migration/iosApp
        run: |
          if [ -d Migration.xcresult ]; then
            xcrun xcresulttool export attachments --path Migration.xcresult --output-path screenshots
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ios-migration-validation
          retention-days: 7
          if-no-files-found: warn
          path: |
            migration/shared/build/reports/tests/
            migration/iosApp/screenshots/
            migration/iosApp/Migration.xcresult/
            migration/iosApp/DerivedData/Build/Products/Debug-iphonesimulator/CaiXiaoTongMigration.app/
