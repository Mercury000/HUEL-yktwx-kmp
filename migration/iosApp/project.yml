name: CaiXiaoTongMigration
options:
  bundleIdPrefix: com.mercury.yktwx
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: NO
targets:
  CaiXiaoTongMigration:
    type: application
    platform: iOS
    sources: [Sources]
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: 财小通验证
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mercury.yktwx.migration
        FRAMEWORK_SEARCH_PATHS: $(inherited) $(SRCROOT)/../composeApp/build/bin/iosSimulatorArm64/debugFramework
        OTHER_LDFLAGS: $(inherited) -framework MigrationApp
    dependencies:
      - framework: ../composeApp/build/bin/iosSimulatorArm64/debugFramework/MigrationApp.framework
        embed: false
  MigrationUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: CaiXiaoTongMigration
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  CaiXiaoTongMigration:
    build:
      targets:
        CaiXiaoTongMigration: all
        MigrationUITests: [test]
    test:
      targets: [MigrationUITests]
